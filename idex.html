<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滑舌トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1117;
  --panel:#151d28;
  --panel-2:#1c2634;
  --line:#2b394a;
  --fog:#8494a8;
  --paper:#e9eef4;
  --hit:#79d8bd;
  --miss:#ff8f72;
  --wait:#f0cb74;
  --lamp:#fff3d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
  padding:0 0 env(safe-area-inset-bottom);
}
.app{width:100%;max-width:540px;padding:20px 18px 40px;display:flex;flex-direction:column;gap:18px}

/* ---- header ---- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;letter-spacing:.14em}
.brand span{color:var(--fog);font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:11px;letter-spacing:.2em;display:block;margin-top:3px}
.levels{display:flex;gap:6px}
.lv{
  background:none;border:1px solid var(--line);color:var(--fog);
  font:500 12px/1 "Zen Kaku Gothic New",sans-serif;
  padding:8px 10px;border-radius:999px;cursor:pointer;
}
.lv[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}

/* ---- card ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.kanji{color:var(--fog);font-size:13px;letter-spacing:.06em;text-align:center;margin-bottom:16px}

.blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blk{
  font-family:"Shippori Mincho B1",serif;font-weight:600;
  font-size:clamp(21px,6.4vw,29px);
  line-height:1.15;letter-spacing:.03em;
  padding:9px 11px;border-radius:11px;
  background:var(--panel-2);border:1px solid var(--line);
  color:var(--paper);
  transition:background .28s ease,border-color .28s ease,color .28s ease,transform .28s ease;
}
.blk.is-hit{background:rgba(121,216,189,.14);border-color:var(--hit);color:var(--hit)}
.blk.is-miss{background:rgba(255,143,114,.14);border-color:var(--miss);color:var(--miss);transform:translateY(2px)}
.blk.is-live{border-color:var(--wait)}

/* ---- score ---- */
.score{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:20px;min-height:52px}
.num{font-family:"JetBrains Mono",monospace;font-size:46px;line-height:.9;letter-spacing:-.02em}
.pct{color:var(--fog);font-size:13px;padding-bottom:6px}
.verdict{text-align:center;color:var(--fog);font-size:13px;margin-top:6px;min-height:20px}
.heard{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  color:var(--fog);font-size:12.5px;line-height:1.7;text-align:center;word-break:break-all;
}
.heard b{color:var(--paper);font-weight:500}

/* ---- mic ---- */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.mic{
  width:118px;height:118px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);
  color:var(--lamp);font:700 15px/1.4 "Zen Kaku Gothic New",sans-serif;
  cursor:pointer;position:relative;
}
.mic:disabled{opacity:.4;cursor:default}
.mic.is-on{background:rgba(240,203,116,.12);border-color:var(--wait);color:var(--wait)}
.mic.is-on::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1px solid var(--wait);opacity:.55;animation:ping 1.5s ease-out infinite;
}
@keyframes ping{to{transform:scale(1.22);opacity:0}}
.mic:focus-visible,.lv:focus-visible,.btn:focus-visible,.tog:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

.row{display:flex;gap:10px;width:100%}
.btn{
  flex:1;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  font:500 14px/1 "Zen Kaku Gothic New",sans-serif;padding:15px 0;border-radius:12px;cursor:pointer;
}
.tog{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--paper);cursor:pointer;
  font:500 14px/1.4 "Zen Kaku Gothic New",sans-serif;text-align:left;
}
.tog small{display:block;color:var(--fog);font-size:11.5px;font-weight:400;margin-top:3px}
.dot{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.dot::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fog);transition:transform .2s,background .2s}
.tog[aria-pressed="true"] .dot{background:rgba(240,203,116,.35)}
.tog[aria-pressed="true"] .dot::after{transform:translateX(16px);background:var(--wait)}

/* ---- weak-sound map ---- */
.map h2{font-size:12px;letter-spacing:.18em;color:var(--fog);font-weight:500;margin-bottom:14px}
.bar{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px}
.bar i{font-style:normal;font-family:"Shippori Mincho B1",serif;font-size:15px}
.track{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--hit);transition:width .5s ease,background .5s ease}
.bar em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--fog);text-align:right}
.empty{color:var(--fog);font-size:12.5px;line-height:1.7}
.note{color:var(--fog);font-size:11.5px;line-height:1.8;text-align:center}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">滑舌トレーナー<span>SAY IT CLEARLY</span></div>
    <div class="levels" role="group" aria-label="レベル">
      <button class="lv" data-lv="1" aria-pressed="true">初級</button>
      <button class="lv" data-lv="2" aria-pressed="false">中級</button>
      <button class="lv" data-lv="3" aria-pressed="false">上級</button>
    </div>
  </header>

  <section class="card">
    <p class="kanji" id="kanji">読み込み中</p>
    <div class="blocks" id="blocks"></div>
    <div class="score"><span class="num" id="num">—</span><span class="pct" id="pct"></span></div>
    <p class="verdict" id="verdict">マイクを押して、はっきり読み上げてください</p>
    <p class="heard" id="heard" hidden></p>
  </section>

  <div class="mic-wrap">
    <button class="mic" id="mic">読み上げる</button>
    <div class="row">
      <button class="btn" id="again">もう一度</button>
      <button class="btn" id="next">次のお題</button>
    </div>
    <button class="tog" id="hands" aria-pressed="false">
      <span>ハンズフリー<small>お題を読み上げ→自動で録音→採点を音声で返答</small></span>
      <span class="dot"></span>
    </button>
  </div>

  <section class="card map">
    <h2>音の崩れマップ</h2>
    <div id="mapBody"><p class="empty">読み上げるほど、どの行が崩れやすいか溜まっていきます。</p></div>
  </section>

  <p class="note" id="note"></p>
</div>

<script>
/* ============ お題 ============ */
const PHRASES = [
  {lv:1, text:"生麦生米生卵", seg:[["生麦","なまむぎ"],["生米","なまごめ"],["生卵","なまたまご"]]},
  {lv:1, text:"赤巻紙青巻紙黄巻紙", seg:[["赤巻紙","あかまきがみ"],["青巻紙","あおまきがみ"],["黄巻紙","きまきがみ"]]},
  {lv:1, text:"バスガス爆発", seg:[["バス","ばす"],["ガス","がす"],["爆発","ばくはつ"]]},
  {lv:1, text:"右目右耳右耳右目", seg:[["右目","みぎめ"],["右耳","みぎみみ"],["右耳","みぎみみ"],["右目","みぎめ"]]},
  {lv:1, text:"新春シャンソンショー", seg:[["新春","しんしゅん"],["シャンソン","しゃんそん"],["ショー","しょー"]]},
  {lv:2, text:"東京特許許可局", seg:[["東京","とうきょう"],["特許","とっきょ"],["許可局","きょかきょく"]]},
  {lv:2, text:"隣の客はよく柿食う客だ", seg:[["隣の","となりの"],["客は","きゃくは"],["よく","よく"],["柿食う","かきくう"],["客だ","きゃくだ"]]},
  {lv:2, text:"この釘は引き抜きにくい釘だ", seg:[["この","この"],["釘は","くぎは"],["引き抜きにくい","ひきぬきにくい"],["釘だ","くぎだ"]]},
  {lv:2, text:"打者一斉に走者一掃", seg:[["打者","だしゃ"],["一斉に","いっせいに"],["走者","そうしゃ"],["一掃","いっそう"]]},
  {lv:2, text:"除雪車除雪作業中", seg:[["除雪車","じょせつしゃ"],["除雪","じょせつ"],["作業中","さぎょうちゅう"]]},
  {lv:3, text:"坊主が屏風に上手に坊主の絵を描いた", seg:[["坊主が","ぼうずが"],["屏風に","びょうぶに"],["上手に","じょうずに"],["坊主の","ぼうずの"],["絵を","えを"],["描いた","かいた"]]},
  {lv:3, text:"空虚な九州空港の究極高級航空機", seg:[["空虚な","くうきょな"],["九州","きゅうしゅう"],["空港の","くうこうの"],["究極","きゅうきょく"],["高級","こうきゅう"],["航空機","こうくうき"]]},
  {lv:3, text:"東京特許許可局局長今日急遽休暇許可", seg:[["東京","とうきょう"],["特許","とっきょ"],["許可局","きょかきょく"],["局長","きょくちょう"],["今日","きょう"],["急遽","きゅうきょ"],["休暇","きゅうか"],["許可","きょか"]]}
];

/* ============ 行の判定 ============ */
const GYO = [
  ["あ行","あいうえお"],["か行","かきくけこ"],["が行","がぎぐげご"],
  ["さ行","さしすせそ"],["ざ行","ざじずぜぞ"],["た行","たちつてと"],["だ行","だぢづでど"],
  ["な行","なにぬねの"],["は行","はひふへほ"],["ば行","ばびぶべぼ"],["ぱ行","ぱぴぷぺぽ"],
  ["ま行","まみむめも"],["や行","やゆよ"],["ら行","らりるれろ"],["わ行","わをん"]
];
function gyoOf(ch){
  for(const [name,set] of GYO) if(set.includes(ch)) return name;
  return null;
}

/* ============ 状態 ============ */
let level = 1, cur = null, listening = false, handsFree = false, autoTimer = null;
const stats = loadStats();

const $ = id => document.getElementById(id);
const kanjiEl=$("kanji"), blocksEl=$("blocks"), numEl=$("num"), pctEl=$("pct"),
      verdictEl=$("verdict"), heardEl=$("heard"), micEl=$("mic"), noteEl=$("note");

/* ============ 音声認識 ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if(SR){
  rec = new SR();
  rec.lang = "ja-JP";
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.continuous = false;
  rec.onresult = e => {
    const alts = [];
    for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
    judge(alts);
  };
  rec.onerror = e => {
    stopUI();
    verdictEl.textContent = e.error === "not-allowed"
      ? "マイクが許可されていません。ブラウザの設定で許可してください。"
      : "うまく聞き取れませんでした。もう一度どうぞ。";
  };
  rec.onend = () => stopUI();
}else{
  micEl.disabled = true;
  verdictEl.textContent = "このブラウザは音声認識に対応していません。Android の Chrome で開いてください。";
}

/* 起動時チェック：ここで落ちているケースが多い */
function preflight(){
  if(location.protocol === "file:"){
    micEl.disabled = true;
    verdictEl.textContent = "ファイルを直接開いた状態（file://）ではマイクが使えません。https のURLから開く必要があります。";
    return false;
  }
  if(!window.isSecureContext){
    micEl.disabled = true;
    verdictEl.textContent = "安全な接続（https）ではないため、マイクが使えません。";
    return false;
  }
  return true;
}

/* ============ 判定 ============ */
function normalize(s){
  return s.replace(/[\s、。・,.!?！？「」]/g,"")
          .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .toLowerCase();
}
function kataToHira(s){
  return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}

function matchOnce(heard){
  const h = normalize(heard);
  const hHira = kataToHira(h);
  let cursor = 0, results = [];
  for(const [kanji,kana] of cur.seg){
    const k = normalize(kanji), y = kataToHira(normalize(kana));
    let idx = h.indexOf(k, cursor);
    let len = k.length;
    if(idx < 0){ idx = hHira.indexOf(y, cursor); len = y.length; }
    if(idx >= 0){ results.push(true); cursor = idx + len; }
    else results.push(false);
  }
  return results;
}

function judge(alts){
  let best = null, bestScore = -1;
  for(const a of alts){
    const r = matchOnce(a);
    const s = r.filter(Boolean).length;
    if(s > bestScore){ bestScore = s; best = {r, heard:a}; }
  }
  render(best.r, best.heard);
}

function render(res, heard){
  const total = cur.seg.reduce((n,s)=>n+s[1].length,0);
  const ok = cur.seg.reduce((n,s,i)=>n+(res[i]?s[1].length:0),0);
  const score = Math.round(ok/total*100);

  [...blocksEl.children].forEach((el,i)=>{
    el.classList.remove("is-live");
    el.classList.toggle("is-hit", res[i]);
    el.classList.toggle("is-miss", !res[i]);
  });

  numEl.textContent = score;
  pctEl.textContent = "点";
  numEl.style.color = score>=90?"var(--hit)":score>=60?"var(--wait)":"var(--miss)";

  const missed = cur.seg.filter((s,i)=>!res[i]).map(s=>s[1]);
  verdictEl.textContent = score===100 ? "完璧です。きれいに通りました。"
    : missed.length ? "崩れたのは「"+missed.join("」「")+"」"
    : "おおむね伝わっています。";

  heardEl.hidden = false;
  heardEl.innerHTML = "聞こえた音　<b>"+heard+"</b>";

  recordStats(res);
  drawMap();

  if(handsFree){
    speak(score>=90 ? score+"点。きれいです。" : score+"点。"+(missed[0]?missed[0]+"、が崩れました。":""), ()=>{
      autoTimer = setTimeout(()=>{ nextPhrase(); startListen(); }, 900);
    });
  }
}

/* ============ 統計 ============ */
function loadStats(){
  try{ return JSON.parse(localStorage.getItem("katsuzetsu")||"{}"); }catch(e){ return {}; }
}
function saveStats(){
  try{ localStorage.setItem("katsuzetsu", JSON.stringify(stats)); }catch(e){}
}
function recordStats(res){
  cur.seg.forEach(([kanji,kana],i)=>{
    for(const ch of kana){
      const g = gyoOf(ch);
      if(!g) continue;
      stats[g] = stats[g] || {ok:0,all:0};
      stats[g].all++;
      if(res[i]) stats[g].ok++;
    }
  });
  saveStats();
}
function drawMap(){
  const rows = Object.entries(stats).filter(([,v])=>v.all>=4)
    .map(([g,v])=>({g, rate:v.ok/v.all, all:v.all}))
    .sort((a,b)=>a.rate-b.rate).slice(0,8);
  const body = $("mapBody");
  if(!rows.length){
    body.innerHTML = '<p class="empty">読み上げるほど、どの行が崩れやすいか溜まっていきます。</p>';
    return;
  }
  body.innerHTML = rows.map(r=>{
    const pc = Math.round(r.rate*100);
    const col = pc>=90?"var(--hit)":pc>=70?"var(--wait)":"var(--miss)";
    return '<div class="bar"><i>'+r.g+'</i><div class="track"><div class="fill" style="width:'+pc+'%;background:'+col+'"></div></div><em>'+pc+'</em></div>';
  }).join("");
}

/* ============ お題の表示 ============ */
function nextPhrase(){
  const pool = PHRASES.filter(p=>p.lv===level);
  let p;
  do{ p = pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1 && p===cur);
  cur = p;
  kanjiEl.textContent = p.text;
  blocksEl.innerHTML = p.seg.map(s=>'<span class="blk">'+s[1]+'</span>').join("");
  numEl.textContent = "—"; numEl.style.color="var(--paper)"; pctEl.textContent="";
  verdictEl.textContent = "マイクを押して、はっきり読み上げてください";
  heardEl.hidden = true;
}

/* ============ 録音制御 ============ */
function startListen(){
  if(!rec || listening) return;
  listening = true;
  micEl.classList.add("is-on");
  micEl.textContent = "聞いています";
  verdictEl.textContent = "どうぞ";
  [...blocksEl.children].forEach(el=>{el.className="blk is-live";});
  try{ rec.start(); }catch(e){
    stopUI();
    verdictEl.textContent = "マイクを開始できませんでした（"+(e.name||e)+"）。";
  }
}
function stopUI(){
  listening = false;
  micEl.classList.remove("is-on");
  micEl.textContent = "読み上げる";
  [...blocksEl.children].forEach(el=>el.classList.remove("is-live"));
}
function speak(text, done){
  if(!window.speechSynthesis){ done && done(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = 1.0;
  u.onend = ()=> done && done();
  speechSynthesis.speak(u);
}

/* ============ イベント ============ */
micEl.addEventListener("click", ()=>{
  if(listening){ rec.stop(); return; }
  startListen();
});
$("again").addEventListener("click", ()=>{
  numEl.textContent="—"; numEl.style.color="var(--paper)"; pctEl.textContent="";
  heardEl.hidden = true;
  [...blocksEl.children].forEach(el=>el.className="blk");
  startListen();
});
$("next").addEventListener("click", ()=>{ clearTimeout(autoTimer); nextPhrase(); });
document.querySelectorAll(".lv").forEach(b=>{
  b.addEventListener("click", ()=>{
    level = +b.dataset.lv;
    document.querySelectorAll(".lv").forEach(x=>x.setAttribute("aria-pressed", x===b));
    nextPhrase();
  });
});
$("hands").addEventListener("click", ()=>{
  handsFree = !handsFree;
  $("hands").setAttribute("aria-pressed", handsFree);
  clearTimeout(autoTimer);
  if(handsFree){
    speak("ハンズフリーを始めます。"+cur.text, ()=>startListen());
  }else{
    speechSynthesis.cancel();
  }
});

nextPhrase();
drawMap();
if(SR) preflight();
noteEl.textContent = "音声認識は通信を使います。走行前に設定してから始めてください。";
</script>
</body>
</html>
